name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site and insert form key
        env:
          KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Secret WEB3FORMS_KEY is missing"; exit 1; fi
          mkdir _site
          cp index.html gadi.jpg serif.woff2 serif-italic.woff2 CNAME _site/
          sed -i "s/WEB3FORMS_ACCESS_KEY/$KEY/" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
